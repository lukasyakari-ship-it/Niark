plugins { id 'com.android.application' }

android {
    namespace 'com.niark.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.niark.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}
