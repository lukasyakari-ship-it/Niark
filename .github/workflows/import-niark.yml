name: Import Niark ZIP

on:
  push:
    branches: [ main ]
    paths:
      - 'Niark-android-dev-v0.2.0.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Niark
        run: |
          rm -rf .niark-import
          mkdir .niark-import
          unzip -o Niark-android-dev-v0.2.0.zip -d .niark-import
          cp -a .niark-import/. .
          rm -rf .niark-import Niark-android-dev-v0.2.0.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Niark Android project" || exit 0
          git push
